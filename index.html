<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gokul Chetry — Artist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;color:#222;background:#fafafa;line-height:1.6}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10;flex-wrap:wrap}
nav .brand{font-weight:700;font-size:1.2rem;color:#222}
nav .links a{margin-left:1.2rem;text-decoration:none;color:#555;cursor:pointer}
nav .links a:hover,nav .links a.active{color:#000;border-bottom:2px solid #000}
#hero{position:relative;margin-bottom:110px}
.cover{height:300px;background:#ddd center/cover no-repeat}
.profile-wrap{text-align:center;margin-top:-70px}
.profile{width:140px;height:140px;border-radius:50%;background:#ccc center/cover no-repeat;margin:0 auto;border:5px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#artistName{margin-top:1rem;font-size:2rem}
#tagline{color:#777}
.bio{max-width:720px;margin:0 auto 3rem;padding:0 1.5rem;text-align:center}
.page-title{text-align:center;margin:2rem 0;font-size:1.8rem;font-weight:300;letter-spacing:2px;text-transform:uppercase}
.page{display:none;padding:1rem 0 3rem}
.page.active{display:block}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;padding:0 2rem;max-width:1200px;margin:0 auto}
.painting{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.painting img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.painting .info{padding:.8rem 1rem}
.painting h3{font-size:1rem;margin-bottom:.3rem}
.painting p{font-size:.85rem;color:#666}
.events-list,.blog-list{max-width:800px;margin:0 auto;padding:0 2rem}
.event,.post{background:#fff;padding:1.2rem 1.5rem;border-radius:6px;margin-bottom:1rem;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.event h3,.post h3{margin-bottom:.3rem}
.date{font-size:.8rem;color:#999;margin-bottom:.5rem}
.contact-form{max-width:520px;margin:0 auto;padding:0 1.5rem;display:flex;flex-direction:column;gap:1rem}
.contact-form label{display:flex;flex-direction:column;font-size:.9rem;color:#555}
.contact-form input,.contact-form textarea{padding:.7rem;border:1px solid #ccc;border-radius:4px;font-size:1rem;margin-top:.3rem;font-family:inherit}
.contact-form button{padding:.8rem;background:#222;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer}
footer{text-align:center;padding:2rem;color:#999;font-size:.85rem;border-top:1px solid #eee;margin-top:3rem}
.empty{text-align:center;color:#aaa;padding:3rem 1rem;font-style:italic}
</style>
</head>
<body>
<nav>
  <div class="brand">Gokul Chetry</div>
  <div class="links">
    <a data-page="home" class="active">Home</a>
    <a data-page="gallery">Gallery</a>
    <a data-page="events">Events</a>
    <a data-page="blog">Blog</a>
    <a data-page="contact">Contact</a>
  </div>
</nav>

<!-- HOME -->
<section id="home" class="page active">
  <div id="hero">
    <div id="cover" class="cover"></div>
    <div class="profile-wrap">
      <div id="profile" class="profile"></div>
      <h1 id="artistName">Gokul Chetry</h1>
      <p id="tagline"></p>
    </div>
  </div>
  <div class="bio"><div id="bioContent"></div></div>
</section>

<!-- GALLERY -->
<section id="gallery" class="page">
  <h1 class="page-title">Gallery</h1>
  <div id="galleryGrid" class="gallery-grid"></div>
</section>

<!-- EVENTS -->
<section id="events" class="page">
  <h1 class="page-title">Events</h1>
  <div id="eventsList" class="events-list"></div>
</section>

<!-- BLOG -->
<section id="blog" class="page">
  <h1 class="page-title">Blog</h1>
  <div id="blogList" class="blog-list"></div>
</section>

<!-- CONTACT -->
<section id="contact" class="page">
  <h1 class="page-title">Contact</h1>
  <form name="contact" method="POST" data-netlify="true" class="contact-form">
    <input type="hidden" name="form-name" value="contact">
    <label>Name<input type="text" name="name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Message<textarea name="message" rows="5" required></textarea></label>
    <button type="submit">Send</button>
  </form>
</section>

<footer>© <span id="year"></span> Gokul Chetry</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Page switching (hash based so links are shareable)
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id===id));
  document.querySelectorAll('nav .links a').forEach(a=>a.classList.toggle('active', a.dataset.page===id));
  window.scrollTo(0,0);
}
document.querySelectorAll('nav .links a').forEach(a=>{
  a.addEventListener('click', ()=>{ location.hash = a.dataset.page; });
});
window.addEventListener('hashchange', ()=> showPage(location.hash.slice(1) || 'home'));
showPage(location.hash.slice(1) || 'home');

async function loadJSON(path){
  try { const r = await fetch(path + '?t=' + Date.now()); if(!r.ok) return null; return await r.json(); }
  catch { return null; }
}

async function loadAll(){
  // Home
  const h = await loadJSON('content/home.json');
  if(h){
    if(h.cover) document.getElementById('cover').style.backgroundImage = `url('${h.cover}')`;
    if(h.profile) document.getElementById('profile').style.backgroundImage = `url('${h.profile}')`;
    if(h.name) document.getElementById('artistName').textContent = h.name;
    if(h.tagline) document.getElementById('tagline').textContent = h.tagline;
    if(h.bio) document.getElementById('bioContent').innerHTML = h.bio.replace(/\n/g,'<br>');
  }

  // Gallery
  const g = await loadJSON('content/gallery.json');
  const gItems = (g && g.items) || [];
  const gEl = document.getElementById('galleryGrid');
  gEl.innerHTML = gItems.length ? gItems.map(p => `
    <div class="painting">
      <img src="${p.image}" alt="${p.title||''}">
      <div class="info">
        <h3>${p.title||''}</h3>
        <p>${p.description||''}</p>
      </div>
    </div>`).join('') : '<div class="empty">No paintings uploaded yet.</div>';

  // Events
  const e = await loadJSON('content/events.json');
  const eItems = (e && e.items) || [];
  document.getElementById('eventsList').innerHTML = eItems.length ? eItems.map(ev => `
    <div class="event">
      <div class="date">${ev.date||''}</div>
      <h3>${ev.title||''}</h3>
      <p>${ev.description||''}</p>
    </div>`).join('') : '<div class="empty">No events yet.</div>';

  // Blog
  const b = await loadJSON('content/blog.json');
  const bItems = (b && b.items) || [];
  document.getElementById('blogList').innerHTML = bItems.length ? bItems.map(post => `
    <div class="post">
      <div class="date">${post.date||''}</div>
      <h3>${post.title||''}</h3>
      <p>${(post.body||'').replace(/\n/g,'<br>')}</p>
    </div>`).join('') : '<div class="empty">No blog posts yet.</div>';
}
loadAll();
</script>
</body>
</html>
